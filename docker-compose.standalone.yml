# Standalone local copy — isolated from VPS (separate volumes + project name).
# Requires Docker Desktop on Windows.
#
#   scripts/start_standalone.ps1
#   scripts/stop_standalone.ps1

name: aiops-local

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiops_local_secret}
      POSTGRES_DB: ${POSTGRES_DB:-aiops}
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiops}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data_local:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env.standalone
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker-general:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A workers.celery_app worker -Q ingestion,labeling,monitor,reports -c 2 --loglevel=info
    env_file: .env.standalone
    volumes:
      - ./backend:/app
    depends_on:
      - api
      - redis
      - postgres
      - minio

  worker-training:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A workers.celery_app worker -Q training -c 1 --prefetch-multiplier=1 --loglevel=info
    env_file: .env.standalone
    volumes:
      - ./backend:/app
      - training_data_local:/tmp/training
    depends_on:
      - api
      - redis
      - postgres
      - minio

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: ""
      VITE_WS_URL: ""
    depends_on:
      - api

volumes:
  postgres_data_local:
  minio_data_local:
  training_data_local:
