services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiops_secret}
      POSTGRES_DB: ${POSTGRES_DB:-aiops}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiops}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker-ingestion:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A workers.celery_app worker -Q ingestion -c 4 --loglevel=info
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      - api
      - redis
      - postgres
      - minio

  worker-labeling:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A workers.celery_app worker -Q labeling -c 1 --loglevel=info
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      - api
      - redis
      - postgres
      - minio

  worker-training:
    build:
      context: ./backend
      dockerfile: Dockerfile.gpu
    command: celery -A workers.celery_app worker -Q training -c 1 --loglevel=info
    env_file: .env
    volumes:
      - ./backend:/app
      - training_data:/tmp/training
    depends_on:
      - api
      - redis
      - postgres
      - minio

  worker-deploy:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A workers.celery_app worker -Q deploy -c 1 --loglevel=info
    env_file: .env
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - api
      - redis
      - postgres
      - minio

  worker-monitor:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A workers.celery_app worker -Q monitor -c 1 --loglevel=info
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      - api
      - redis
      - postgres

  worker-reports:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A workers.celery_app worker -Q reports -c 1 --loglevel=info
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      - api
      - redis
      - postgres
      - minio

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A workers.celery_app beat --loglevel=info
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: "http://localhost:8000"
      VITE_WS_URL: "ws://localhost:8000"

  driver-app:
    build:
      context: ./driver-app
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./driver-app:/app
      - /app/node_modules

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:
  training_data:
