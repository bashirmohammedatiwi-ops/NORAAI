name: norai_drive
description: NURAI Drive — تطبيق السائق Flutter (خريطة، كاميرا، اكتشاف، مخالفات سرعة)
publish_to: 'none'
version: 3.12.0+32

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.3
  geolocator: ^13.0.2
  camera: ^0.11.0+2
  permission_handler: ^11.3.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  path_provider: ^2.1.5
  vibration: ^2.0.1
  flutter_compass: ^0.8.1
  image: ^4.5.4
  crypto: ^3.0.6
  sensors_plus: ^6.1.1
  flutter_onnxruntime: ^1.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
