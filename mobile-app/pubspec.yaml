publish_to: 'none'
version: 3.1.0+4

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.3
  geolocator: ^13.0.2
  camera: ^0.11.0+2
