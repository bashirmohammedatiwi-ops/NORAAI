  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  path_provider: ^2.1.5
  vibration: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
