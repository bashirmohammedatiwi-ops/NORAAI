name: rasid_auto
description: RASID Auto — تطبيق قيادة ذكي أوفلاين مع Android Auto وكشف الحفر والحوادث
publish_to: 'none'
version: 1.5.8+22

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  geolocator: ^13.0.2
  camera: ^0.11.0+2
  permission_handler: ^11.3.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.2
  path_provider: ^2.1.5
  path: ^1.9.1
  vibration: ^2.0.1
  sensors_plus: ^6.1.1
  image: ^4.5.4
  crypto: ^3.0.6
  shared_preferences: ^2.3.3
  sqflite: ^2.4.1
  url_launcher: ^6.3.1
  intl: ^0.20.2
  uuid: ^4.5.1
  file_picker: ^8.1.7
  flutter_compass: ^0.8.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/brand/
